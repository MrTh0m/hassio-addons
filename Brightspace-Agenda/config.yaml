name: "Brightspace Agenda"
version: "1.0.1"
slug: "brightspace_agenda"
description: >-
  Suivi des devoirs, live sessions et ateliers de groupe pour tout
  établissement utilisant Brightspace by D2L. Auto-hébergé directement
  depuis Home Assistant, panneau latéral inclus.
url: "https://github.com/MrTh0m/Brightspace_agenda"
arch:
  - amd64
  - aarch64
startup: application
boot: auto

# Panneau gauche (Ingress) : accès authentifié via la session Home Assistant
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-clock
panel_title: "Brightspace Agenda"

# Accès direct sur le même port : installation PWA, liens de partage (?share=TOKEN),
# flux ICS abonnables (?action=export_ics) et polling de l'intégration HACS,
# qui ne passent pas par la session Home Assistant et ont donc besoin d'une URL stable.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Accès direct (PWA, partage, export ICS, polling HACS)"

# /data est fourni automatiquement par le Supervisor et persiste entre les mises à jour :
# c'est ce dossier qui accueille data/config.json et data/state.json de l'app (voir DOCS.md).
#
# dashboard_password est obligatoire : l'addon sert l'app en mode "connecté",
# qui nécessite toujours un compte. Pas de valeur par défaut ci-dessous
# volontairement : le Supervisor bloque le démarrage tant qu'il n'est pas
# renseigné, il ne peut donc pas y avoir de mode connecté sans mot de passe.
# Accès à l'API Supervisor pour publier le service Discovery (permet à
# l'intégration HACS de détecter l'addon automatiquement).
# manager (pas default) : role requis par l'API Supervisor pour POST
# /discovery, sous peine de 403. A verifier au premier build.
hassio_api: true
hassio_role: manager

options:
  timezone: "Europe/Paris"
schema:
  timezone: "str"
  dashboard_password: "password"
