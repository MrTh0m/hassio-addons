configuration:
  timezone:
    name: Timezone
    description: >-
      PHP/server timezone used by the app for ICS export timestamps
      (e.g. Europe/Paris).
  dashboard_password:
    name: Dashboard password (required)
    description: >-
      Required: the app always runs in "connected mode", which needs an
      account. Used only on first start to create it automatically. Has no
      effect once data/config.json already exists (change the password from
      the app's own Settings, or via /setup.php, after that point).
network:
  8099/tcp: Web UI (direct access, PWA install, share links, HACS polling)
