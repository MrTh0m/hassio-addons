configuration:
  timezone:
    name: Fuseau horaire
    description: >-
      Fuseau horaire PHP/serveur utilisé par l'app pour l'export ICS
      (ex. Europe/Paris).
  dashboard_password:
    name: Mot de passe du tableau de bord (obligatoire)
    description: >-
      Obligatoire : l'app fonctionne toujours en "mode connecté", qui
      nécessite un compte. Utilisé uniquement au premier démarrage pour le
      créer automatiquement. Sans effet une fois data/config.json déjà créé
      (change le mot de passe depuis les Paramètres de l'app, ou via
      /setup.php, à partir de là).
network:
  8099/tcp: Interface web (accès direct, installation PWA, liens de partage, polling HACS)
