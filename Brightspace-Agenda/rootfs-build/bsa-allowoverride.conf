# bsa-allowoverride.conf
#
# Le .htaccess ecrit par l'app dans data/ (Require all denied, voir
# setup.php) ne s'applique que si AllowOverride autorise les .htaccess a cet
# endroit. Le apache2.conf par defaut de l'image php:8.2-apache met
# AllowOverride None sur plusieurs blocs <Directory> (dont un tres generique
# sur /var/www/) : plutot que de deviner lequel patcher par sed (risque de
# modifier le mauvais bloc et de laisser data/ non protege sans erreur
# visible), on declare ici des blocs plus specifiques, qui l'emportent sur
# les blocs plus generiques du fichier de base independamment de l'ordre de
# chargement (Apache fusionne les <Directory> par specificite de chemin).
#
# Les deux chemins sont couverts : /var/www/html/data (chemin de la requete,
# via le lien symbolique cree par run.sh) et /data (cible reelle du lien).

<Directory /var/www/html/>
    AllowOverride All
</Directory>

<Directory /data/>
    AllowOverride All
</Directory>
