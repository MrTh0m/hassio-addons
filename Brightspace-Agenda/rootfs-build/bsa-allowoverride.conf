# bsa-allowoverride.conf
#
# Le .htaccess écrit par l'app dans data/ (Require all denied, voir
# setup.php) ne s'applique que si AllowOverride autorise les .htaccess à cet
# endroit. Le apache2.conf par défaut de l'image php:8.2-apache met
# AllowOverride None sur plusieurs blocs <Directory> (dont un très générique
# sur /var/www/) : plutôt que de deviner lequel patcher par sed (risque de
# modifier le mauvais bloc et de laisser data/ non protégé sans erreur
# visible), on déclare ici des blocs plus spécifiques, qui l'emportent sur
# les blocs plus génériques du fichier de base indépendamment de l'ordre de
# chargement (Apache fusionne les <Directory> par spécificité de chemin).
#
# Les deux chemins sont couverts : /var/www/html/data (chemin de la requête,
# via le lien symbolique créé par run.sh) et /data (cible réelle du lien).

<Directory /var/www/html/>
    AllowOverride All
</Directory>

<Directory /data/>
    AllowOverride All
</Directory>
