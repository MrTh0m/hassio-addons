<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCPP Server</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #d8dae0;
    --header-bg: #1f2937;
    --header-fg: #f4f5f7;
    --accent: #2563eb;
    --muted: #6b7280;
  }
  html[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8e9ec;
    --card-bg: #1e2128;
    --border: #33363d;
    --header-bg: #101216;
    --header-fg: #e8e9ec;
    --accent: #4d8dff;
    --muted: #9099a5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    background: var(--header-bg);
    color: var(--header-fg);
    padding: 0.9rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { display: flex; align-items: baseline; gap: 0.6rem; }
  header .brand h1 { font-size: 1.15rem; margin: 0; }
  header .version { font-size: 0.75rem; color: var(--muted); }
  header button.icon-btn {
    background: transparent; border: 1px solid #ffffff33; color: inherit;
    border-radius: 6px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 0.95rem;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin: 0 0 0.6rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
  button {
    cursor: pointer; padding: 0.35rem 0.8rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--fg);
  }
  button:hover { border-color: var(--accent); }
  input, select {
    padding: 0.35rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--fg);
  }
  .row { display: flex; gap: 0.5rem; align-items: center; margin: 0.3rem 0; flex-wrap: wrap; }
  .badge { padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; }
  .badge.local { background: #2a72; }
  .badge.relay { background: #a742; }
  .badge.on, .badge.Charging { background: #2a7; color: #fff; }
  .badge.off { background: #888; color: #fff; }
  .badge.Available { background: #2a7; color: #fff; }
  .badge.Preparing, .badge.SuspendedEV, .badge.SuspendedEVSE { background: #d97706; color: #fff; }
  .badge.Faulted { background: #dc2626; color: #fff; }
  #login-box {
    max-width: 340px; margin: 4rem auto; padding: 1.5rem;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  }
  .charger-detail {
    display: none; padding: 0.8rem; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 8px; margin: 0.3rem 0 1rem;
  }
  .charger-detail.open { display: block; }
  .connector-card {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; margin: 0.4rem 0;
  }
  .error { color: #e05555; }
  a.expand, a.link { cursor: pointer; color: var(--accent); text-decoration: underline; }

  /* Splash-screen / modale */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: #0008;
    align-items: center; justify-content: center; z-index: 100; padding: 1rem;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.2rem;
  }
  #modal-box .row.header { justify-content: space-between; margin-bottom: 0.8rem; }

  footer {
    max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem 2rem;
    color: var(--muted); font-size: 0.8rem; text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>OCPP Server</h1>
    <span class="version" id="header-version"></span>
  </div>
  <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle" title="Basculer thème clair/sombre">🌙</button>
</header>

<main>

<div id="login-box">
  <h1 style="margin-top:0">Connexion</h1>
  <div class="row"><input id="username" placeholder="Utilisateur" value="admin" style="flex:1"></div>
  <div class="row"><input id="password" type="password" placeholder="Mot de passe" style="flex:1"></div>
  <div class="row"><button onclick="login()">Se connecter</button></div>
  <div id="login-error" class="error"></div>
</div>

<div id="app" style="display:none">
  <div class="row" style="justify-content: space-between">
    <h1>Bornes</h1>
    <div class="row">
      <button onclick="loadChargers()">Rafraîchir</button>
      <button onclick="logout()">Déconnexion</button>
    </div>
  </div>
  <table id="chargers-table">
    <thead>
      <tr><th>ID</th><th>Vendeur / Modèle</th><th>Version</th><th>Mode</th><th>Statut</th><th>Connectée</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</main>

<div id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div id="modal-box"></div>
</div>

<footer>
  OCPP Backoffice Server v<span id="footer-version"></span> ·
  <a href="https://github.com/MrTh0m/hassio-addons" target="_blank" rel="noopener">dépôt GitHub</a> ·
  cœur protocole sous licence MIT (<a href="https://github.com/mobilityhouse/ocpp" target="_blank" rel="noopener">mobilityhouse/ocpp</a>)
</footer>

<script>
let token = localStorage.getItem("ocpp_token") || null;

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("ocpp_theme", next);
  applyTheme(next);
}

(function initTheme() {
  const stored = localStorage.getItem("ocpp_theme");
  const preferred = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
})();

fetch("/api/version").then(r => r.json()).then(d => {
  document.getElementById("header-version").textContent = "v" + d.version;
  document.getElementById("footer-version").textContent = d.version;
}).catch(() => {});

function authHeaders() {
  return { "Authorization": "Bearer " + token };
}

function openModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const body = new URLSearchParams({ username, password });
  const resp = await fetch("/api/auth/login", { method: "POST", body });
  if (!resp.ok) {
    document.getElementById("login-error").textContent = "Identifiants invalides";
    return;
  }
  const data = await resp.json();
  token = data.access_token;
  localStorage.setItem("ocpp_token", token);
  showApp();
}

function logout() {
  localStorage.removeItem("ocpp_token");
  token = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("login-box").style.display = "block";
}

function showApp() {
  document.getElementById("login-box").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadChargers();
  if (!window._pollStarted) {
    window._pollStarted = true;
    setInterval(() => { if (!openCharger) loadChargers(); }, 5000);
  }
}

async function loadChargers() {
  const resp = await fetch("/api/chargers", { headers: authHeaders() });
  if (resp.status === 401) { logout(); return; }
  const chargers = await resp.json();
  const tbody = document.querySelector("#chargers-table tbody");
  tbody.innerHTML = "";
  for (const c of chargers) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.id}</td>
      <td>${c.vendor || "-"} ${c.model || ""}</td>
      <td>${c.ocpp_version || "-"}</td>
      <td><span class="badge ${c.mode}">${c.mode}</span></td>
      <td>${c.status}</td>
      <td><span class="badge ${c.connected ? "on" : "off"}">${c.connected ? "oui" : "non"}</span></td>
      <td><a class="expand" onclick="toggleDetail('${c.id}')">détails</a></td>
    `;
    tbody.appendChild(tr);
    const detailTr = document.createElement("tr");
    detailTr.innerHTML = `<td colspan="7"><div class="charger-detail" id="detail-${c.id}"></div></td>`;
    tbody.appendChild(detailTr);
  }
}

let openCharger = null;

async function toggleDetail(id) {
  const el = document.getElementById("detail-" + id);
  if (openCharger === id) {
    el.classList.remove("open");
    openCharger = null;
    return;
  }
  if (openCharger) {
    const prev = document.getElementById("detail-" + openCharger);
    if (prev) prev.classList.remove("open");
  }
  openCharger = id;
  el.classList.add("open");
  el.innerHTML = "chargement...";

  const [chargerResp, connectorsResp] = await Promise.all([
    fetch(`/api/chargers/${id}`, { headers: authHeaders() }),
    fetch(`/api/chargers/${id}/connectors`, { headers: authHeaders() }),
  ]);
  const charger = await chargerResp.json();
  const connectors = (await connectorsResp.json()).filter(c => c.connector_id !== 0);
  const isLocal = charger.mode === "local";

  let html = `<div class="row">
    <label>Mode de la borne :</label>
    <select id="mode-${id}" onchange="onModeChange('${id}')">
      <option value="local" ${isLocal ? "selected" : ""}>local</option>
      <option value="relay" ${!isLocal ? "selected" : ""}>relais</option>
    </select>
    <input id="relayurl-${id}" placeholder="wss://serveur-officiel/..." value="${charger.relay_url || ""}"
      style="${isLocal ? "display:none" : ""}; min-width:280px">
    <button onclick="saveMode('${id}')">Enregistrer</button>
  </div>`;

  html += `<h2 style="margin-top:1rem">Connecteurs</h2>`;
  if (connectors.length === 0) {
    html += `<p><em>Aucun connecteur détecté pour l'instant (attends le premier StatusNotification de la borne).</em></p>`;
  }
  for (const c of connectors) {
    html += `<div class="connector-card">
      <div>
        <b>Connecteur ${c.connector_id}</b>
        <span class="badge ${c.status}">${c.status}</span>
      </div>
      <a class="link" onclick="openConnectorModal('${id}', ${c.connector_id}, ${isLocal})">détails</a>
    </div>`;
  }

  el.innerHTML = html;
}

function onModeChange(id) {
  const mode = document.getElementById("mode-" + id).value;
  document.getElementById("relayurl-" + id).style.display = mode === "relay" ? "inline-block" : "none";
}

async function saveMode(id) {
  const mode = document.getElementById("mode-" + id).value;
  const relay_url = document.getElementById("relayurl-" + id).value;
  const body = { mode };
  if (mode === "relay") body.relay_url = relay_url;
  const resp = await fetch(`/api/chargers/${id}/mode`, {
    method: "PUT",
    headers: { ...authHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (resp.ok) { toggleDetail(id); toggleDetail(id); } else { alert("Échec de la mise à jour du mode"); }
}

async function openConnectorModal(chargerId, connectorId, isLocal) {
  openModal("chargement...");

  const [sessionsResp, metersResp] = await Promise.all([
    fetch(`/api/chargers/${chargerId}/sessions?connector_id=${connectorId}`, { headers: authHeaders() }),
    fetch(`/api/chargers/${chargerId}/metervalues?connector_id=${connectorId}&limit=10`, { headers: authHeaders() }),
  ]);
  const sessions = await sessionsResp.json();
  const meters = await metersResp.json();

  let html = `<div class="row header">
    <h2>${chargerId} · Connecteur ${connectorId}</h2>
    <button onclick="closeModal()">✕</button>
  </div>`;

  if (isLocal) {
    html += `<div class="row">
      <input id="modal-idtag" placeholder="idTag" style="width:100px">
      <button onclick="startCharge('${chargerId}', ${connectorId})">Démarrer</button>
      <input id="modal-txn" placeholder="ID transaction" style="width:100px">
      <button onclick="stopCharge('${chargerId}', ${connectorId})">Arrêter</button>
    </div>`;
  } else {
    html += `<p><em>Pilotage indisponible : cette borne est en mode relais.</em></p>`;
  }

  html += `<p><b>Sessions récentes</b></p><table><thead><tr>
    <th>#</th><th>Début</th><th>Fin</th><th>Wh</th><th>Statut</th>
  </tr></thead><tbody>`;
  for (const s of sessions.slice(0, 10)) {
    const wh = (s.meter_start != null && s.meter_stop != null) ? (s.meter_stop - s.meter_start) : "-";
    html += `<tr><td>${s.id}</td><td>${s.start_time || "-"}</td>
      <td>${s.stop_time || "-"}</td><td>${wh}</td><td>${s.status}</td></tr>`;
  }
  if (sessions.length === 0) html += `<tr><td colspan="5"><em>Aucune session</em></td></tr>`;
  html += `</tbody></table>`;

  html += `<p><b>Dernières valeurs de compteur</b></p><table><thead><tr>
    <th>Horodatage</th><th>Grandeur</th><th>Valeur</th><th>Unité</th>
  </tr></thead><tbody>`;
  for (const m of meters) {
    html += `<tr><td>${m.timestamp}</td><td>${m.measurand}</td><td>${m.value}</td><td>${m.unit || "-"}</td></tr>`;
  }
  if (meters.length === 0) html += `<tr><td colspan="4"><em>Aucune valeur</em></td></tr>`;
  html += `</tbody></table>`;

  openModal(html);
}

async function startCharge(id, connectorId) {
  const id_tag = document.getElementById("modal-idtag").value || "WEBADMIN";
  const resp = await fetch(`/api/chargers/${id}/connectors/${connectorId}/start`, {
    method: "POST",
    headers: { ...authHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ id_tag }),
  });
  const data = await resp.json().catch(() => ({}));
  alert(resp.ok ? "Démarrage : " + data.status : "Erreur : " + (data.detail || resp.status));
}

async function stopCharge(id, connectorId) {
  const transaction_id = parseInt(document.getElementById("modal-txn").value, 10);
  const resp = await fetch(`/api/chargers/${id}/connectors/${connectorId}/stop`, {
    method: "POST",
    headers: { ...authHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ transaction_id }),
  });
  const data = await resp.json().catch(() => ({}));
  alert(resp.ok ? "Arrêt : " + data.status : "Erreur : " + (data.detail || resp.status));
}

if (token) { showApp(); }
</script>
</body>
</html>
