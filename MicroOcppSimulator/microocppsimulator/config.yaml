name: "MicroOcpp Simulator"
version: "1.0.0"
slug: "microocppsimulator"
description: "Simule une borne de recharge OCPP (client) pour tester l'intégration OCPP de Home Assistant sans borne physique. Basé sur le projet MicroOCPP de matth-x."
url: "https://github.com/matth-x/MicroOcppSimulator"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8000
panel_icon: mdi:ev-station
webui: "http://[HOST]:[PORT:8000]"
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "Interface web du simulateur (accès direct optionnel, en complément de l'ingress)"
options: {}
schema: {}
